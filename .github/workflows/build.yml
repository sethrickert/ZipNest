name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Select version
        id: version
        shell: powershell
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.1.0' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and test both editions
        shell: powershell
        run: .\build\Build.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ZipNest-${{ steps.version.outputs.version }}-windows-x64
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME artifacts\*.exe artifacts\*.zip artifacts\*.sha256 --verify-tag --generate-notes --title "ZipNest $env:GITHUB_REF_NAME"
